[package]
name = "ps7ise-crossplatform-prototype"
version = "0.1.0"
edition = "2021"
description = "OS-agnostic PS7 ISE UI prototype (macOS/Linux/Windows)"
license = "MIT"

[dependencies]
eframe = { version = "0.27.2", default-features = true }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
