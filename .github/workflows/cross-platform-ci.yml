name: cross-platform-ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  prototype:
    name: prototype-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (cross-platform UI prototype)
        working-directory: cross-platform-ui
        run: cargo test --verbose

  engine:
    name: engine-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Dotnet build (PowerShellEngineHost)
        run: dotnet build PowerShellEngineHost/PowerShellEngineHost/PowerShellEngineHost.csproj -c Release
      - name: Prepare engine for protocol test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="PowerShellEngineHost/PowerShellEngineHost/bin/Release/net10.0"
          if [ -f "$BIN/PowerShellEngineHost" ] && [ ! -f "$BIN/PowerShellEngineHost.exe" ]; then
            ln -sf PowerShellEngineHost "$BIN/PowerShellEngineHost.exe"
          fi
          PWSH_BIN="$(command -v pwsh || true)"
          if [ -n "$PWSH_BIN" ]; then
            mkdir -p "$BIN/runtimes/unix/lib/net10.0"
            ln -sf "$PWSH_BIN" "$BIN/runtimes/unix/lib/net10.0/pwsh"
          fi
      - name: Engine protocol smoke test
        shell: pwsh
        run: |
          $bin = "PowerShellEngineHost/PowerShellEngineHost/bin/Release/net10.0"
          if (-not (Test-Path $bin)) { throw "Engine build output not found: $bin" }
          pwsh -NoProfile -File ./engine-protocol-test.ps1 -dist $bin
